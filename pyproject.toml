[project]
name = "laboratorio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dash>=4.4.1",
    "dash-core-components>=2.0.0",
    "dash-html-components>=2.0.0",
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
    "ipython-sql>=0.5.0",
    "ipywidgets>=8.1.8",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "prettytable>=3.18.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "wget>=3.2",
]

[project.scripts]
laboratorio = "laboratorio:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]
